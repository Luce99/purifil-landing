<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin – Purifil</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- LOGIN -->
  <section class="login" id="loginSection">
    <div class="login__card">
      <div class="login__header">
        <i class="fas fa-droplet login__icon"></i>
        <h1>Panel de Administración</h1>
        <p>Purifil – Diana Grisales</p>
      </div>
      <form id="loginForm" class="login__form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required autocomplete="email" placeholder="tu@correo.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="Tu contraseña">
        </div>
        <div class="form-error" id="loginError"></div>
        <button type="submit" class="btn btn--primary btn--full" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> Iniciar sesión
        </button>
        <div class="login__forgot">
          <button type="button" id="forgotPasswordBtn">¿Olvidaste tu contraseña?</button>
        </div>
        <div class="form-success" id="forgotSuccess"></div>
      </form>
    </div>
  </section>

  <!-- ADMIN PANEL -->
  <section class="admin" id="adminSection" style="display:none">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__header">
        <i class="fas fa-droplet"></i>
        <span>Admin Purifil</span>
      </div>
      <nav class="sidebar__nav">
        <button class="sidebar__link active" data-section="products">
          <i class="fas fa-box"></i> Productos
        </button>
        <button class="sidebar__link" data-section="banners">
          <i class="fas fa-images"></i> Banners
        </button>
        <button class="sidebar__link" data-section="contact">
          <i class="fas fa-address-book"></i> Contacto
        </button>
        <button class="sidebar__link" data-section="account">
          <i class="fas fa-user-cog"></i> Mi cuenta
        </button>
      </nav>
      <button class="sidebar__logout" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
      </button>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="main__header">
        <h2 id="sectionTitle">Productos</h2>
        <span id="userEmail" class="main__user"></span>
      </header>

      <!-- PRODUCTS SECTION -->
      <div class="content-section active" id="sec-products">
        <div class="toolbar">
          <button class="btn btn--primary" id="addProductBtn">
            <i class="fas fa-plus"></i> Nuevo Producto
          </button>
        </div>
        <div class="card-list" id="productsList"></div>
      </div>

      <!-- BANNERS SECTION -->
      <div class="content-section" id="sec-banners">
        <div class="toolbar">
          <button class="btn btn--primary" id="addBannerBtn">
            <i class="fas fa-plus"></i> Nuevo Banner
          </button>
        </div>
        <div class="card-list" id="bannersList"></div>
      </div>

      <!-- CONTACT SECTION -->
      <div class="content-section" id="sec-contact">
        <form class="contact-form" id="contactForm">
          <div class="form-group">
            <label for="cfgName">Nombre de la asesora</label>
            <input type="text" id="cfgName" placeholder="Diana Grisales">
          </div>
          <div class="form-group">
            <label for="cfgWhatsapp">Número WhatsApp (con código país, sin +)</label>
            <input type="text" id="cfgWhatsapp" placeholder="573153855543">
          </div>
          <div class="form-group">
            <label for="cfgWhatsappDisplay">WhatsApp visible en la página</label>
            <input type="text" id="cfgWhatsappDisplay" placeholder="315 385 5543">
          </div>
          <div class="form-group">
            <label for="cfgPhones">Teléfonos</label>
            <input type="text" id="cfgPhones" placeholder="601 616 4645 – 601 256 1275">
          </div>
          <div class="form-group">
            <label for="cfgEmail">Email</label>
            <input type="email" id="cfgEmail" placeholder="telemercadeo@purifilinternacional.com">
          </div>
          <button type="submit" class="btn btn--primary">
            <i class="fas fa-save"></i> Guardar cambios
          </button>
          <div class="form-success" id="contactSuccess"></div>
        </form>
      </div>

      <!-- ACCOUNT SECTION -->
      <div class="content-section" id="sec-account">
        <form class="contact-form" id="changePasswordForm">
          <h3 class="account-form__title">Cambiar contraseña</h3>
          <div class="form-group">
            <label for="currentPassword">Contraseña actual</label>
            <input type="password" id="currentPassword" required autocomplete="current-password" placeholder="Tu contraseña actual">
          </div>
          <div class="form-group">
            <label for="newPassword">Nueva contraseña</label>
            <input type="password" id="newPassword" required autocomplete="new-password" placeholder="Mínimo 6 caracteres">
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirmar nueva contraseña</label>
            <input type="password" id="confirmPassword" required autocomplete="new-password" placeholder="Repite la nueva contraseña">
          </div>
          <div class="form-error" id="changePasswordError"></div>
          <button type="submit" class="btn btn--primary">
            <i class="fas fa-key"></i> Actualizar contraseña
          </button>
          <div class="form-success" id="changePasswordSuccess"></div>
        </form>
      </div>

      <!-- PRODUCT MODAL -->
      <div class="modal" id="productModal">
        <div class="modal__overlay"></div>
        <div class="modal__content">
          <div class="modal__header">
            <h3 id="productModalTitle">Nuevo Producto</h3>
            <button class="modal__close" id="closeProductModal"><i class="fas fa-times"></i></button>
          </div>
          <form id="productForm" class="modal__form">
            <input type="hidden" id="prodId">
            <div class="form-row">
              <div class="form-group">
                <label for="prodTitle">Nombre del producto *</label>
                <input type="text" id="prodTitle" required>
              </div>
              <div class="form-group">
                <label for="prodCategory">Categoría *</label>
                <select id="prodCategory" required>
                  <option value="agua">Purificador de Agua</option>
                  <option value="aire">Purificador de Aire</option>
                  <option value="cocina">Utensilios de Cocina</option>
                  <option value="filtracion">Sistema de Filtración</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="prodSection">Sección *</label>
                <select id="prodSection" required>
                  <option value="productos">Productos principales</option>
                  <option value="filtracion">Sistemas de Filtración</option>
                </select>
              </div>
              <div class="form-group">
                <label for="prodBadge">Etiqueta (badge)</label>
                <input type="text" id="prodBadge" placeholder="Popular, Nuevo, Destacado...">
              </div>
            </div>
            <div class="form-group">
              <label for="prodDesc">Descripción *</label>
              <textarea id="prodDesc" rows="3" required></textarea>
            </div>
            <div class="form-group">
              <label for="prodFeatures">Características (separadas por coma)</label>
              <input type="text" id="prodFeatures" placeholder="Acero quirúrgico, Compacto, Fácil instalación">
            </div>
            <div class="form-group">
              <label for="prodWhatsapp">Texto para WhatsApp</label>
              <input type="text" id="prodWhatsapp" placeholder="Nombre del producto para consulta">
            </div>
            <div class="form-group">
              <label for="prodImage">Imagen del producto *</label>
              <input type="file" id="prodImage" accept="image/*">
              <img id="prodImagePreview" class="image-preview" alt="">
            </div>
            <div class="form-group">
              <label for="prodVideo">Video (opcional)</label>
              <input type="file" id="prodVideo" accept="video/*">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="prodOrder">Orden</label>
                <input type="number" id="prodOrder" value="0" min="0">
              </div>
              <div class="form-group form-group--checkbox">
                <label>
                  <input type="checkbox" id="prodActive" checked>
                  Producto activo
                </label>
              </div>
            </div>
            <div class="form-error" id="productError"></div>
            <div class="modal__actions">
              <button type="button" class="btn btn--outline" id="cancelProductBtn">Cancelar</button>
              <button type="submit" class="btn btn--primary" id="saveProductBtn">
                <i class="fas fa-save"></i> Guardar
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- BANNER MODAL -->
      <div class="modal" id="bannerModal">
        <div class="modal__overlay"></div>
        <div class="modal__content modal__content--sm">
          <div class="modal__header">
            <h3 id="bannerModalTitle">Nuevo Banner</h3>
            <button class="modal__close" id="closeBannerModal"><i class="fas fa-times"></i></button>
          </div>
          <form id="bannerForm" class="modal__form">
            <input type="hidden" id="bannerId">
            <div class="form-group">
              <label for="bannerAlt">Texto descriptivo (alt)</label>
              <input type="text" id="bannerAlt" placeholder="Descripción de la imagen">
            </div>
            <div class="form-group">
              <label for="bannerImage">Imagen del banner *</label>
              <input type="file" id="bannerImage" accept="image/*">
              <img id="bannerImagePreview" class="image-preview" alt="">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="bannerOrder">Orden</label>
                <input type="number" id="bannerOrder" value="0" min="0">
              </div>
              <div class="form-group form-group--checkbox">
                <label>
                  <input type="checkbox" id="bannerActive" checked>
                  Banner activo
                </label>
              </div>
            </div>
            <div class="form-error" id="bannerError"></div>
            <div class="modal__actions">
              <button type="button" class="btn btn--outline" id="cancelBannerBtn">Cancelar</button>
              <button type="submit" class="btn btn--primary" id="saveBannerBtn">
                <i class="fas fa-save"></i> Guardar
              </button>
            </div>
          </form>
        </div>
      </div>

    </main>
  </section>

  <script type="module" src="js/admin/auth.js"></script>
  <script type="module" src="js/admin/admin.js"></script>
</body>
</html>
